name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'environments/**'
      - 'modules/**'
      - 'artifacts/**'
      - '.github/workflows/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.6.6"
  AWS_REGION: "ap-southeast-1"

jobs:
  detect-environment:
    name: Detect Target Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
    steps:
      - name: Detect environment from branch name
        id: detect
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ "$BRANCH" == feature/prod* ]] || [[ "$BRANCH" == hotfix/prod* ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == feature/uat* ]] || [[ "$BRANCH" == hotfix/uat* ]]; then
            echo "environment=uat" >> $GITHUB_OUTPUT
          else
            echo "environment=sit" >> $GITHUB_OUTPUT
          fi

  terraform-plan:
    name: Terraform Plan (${{ needs.detect-environment.outputs.environment }})
    runs-on: ubuntu-latest
    needs: detect-environment
    environment: ${{ needs.detect-environment.outputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CDCU_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cdcu-terraform-plan

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: environments/${{ needs.detect-environment.outputs.environment }}
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -input=false
        working-directory: environments/${{ needs.detect-environment.outputs.environment }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: environments/${{ needs.detect-environment.outputs.environment }}

      - name: Terraform Plan
        id: plan
        run: |
          PLAN_ARGS="-no-color -out=tfplan"
          if [ -f terraform.tfvars ]; then
            PLAN_ARGS="-var-file=terraform.tfvars ${PLAN_ARGS}"
          fi
          terraform plan \
            ${PLAN_ARGS} \
            2>&1 | tee plan_output.txt
        working-directory: environments/${{ needs.detect-environment.outputs.environment }}
        continue-on-error: true
        env:
          TF_VAR_terraform_role_arn: ${{ secrets.CDCU_TERRAFORM_ROLE_ARN }}
          TF_VAR_vpc_id: ${{ vars.CDCU_VPC_ID }}
          TF_VAR_subnet_id: ${{ vars.CDCU_SUBNET_ID }}
          TF_VAR_github_org: ${{ github.repository_owner }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}
          TF_VAR_git_repository_url: ${{ github.server_url }}/${{ github.repository }}.git
          TF_VAR_sns_topic_arn: ${{ vars.CDCU_SNS_TOPIC_ARN }}
          TF_VAR_quicksight_admin_principal_arn: ${{ vars.CDCU_QUICKSIGHT_ADMIN_PRINCIPAL_ARN }}

      - name: Post Plan as PR Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync(
              'environments/${{ needs.detect-environment.outputs.environment }}/plan_output.txt',
              'utf8'
            );
            const truncated = planOutput.length > 60000
              ? planOutput.substring(0, 60000) + '\n\n... [truncated — see Actions log for full output]'
              : planOutput;

            const body = `## Terraform Plan — \`${{ needs.detect-environment.outputs.environment }}\`

            #### Format Check: \`${{ steps.fmt.outcome }}\`
            #### Validate: \`${{ steps.validate.outcome }}\`
            #### Plan: \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${truncated}
            \`\`\`

            </details>

            *Triggered by @${{ github.actor }} on \`${{ github.head_ref }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Check Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
