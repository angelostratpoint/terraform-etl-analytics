name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - 'environments/**'
      - 'modules/**'
      - 'artifacts/**'

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.6.6"
  AWS_REGION: "ap-southeast-1"

jobs:
  detect-environment:
    name: Detect Target Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
    steps:
      - name: Detect environment from commit message tag
        id: detect
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if echo "$COMMIT_MSG" | grep -q '\[env:prod\]'; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=pre-prod" >> $GITHUB_OUTPUT
          fi

  terraform-apply:
    name: Terraform Apply (${{ needs.detect-environment.outputs.environment }})
    runs-on: ubuntu-latest
    needs: detect-environment
    environment: ${{ needs.detect-environment.outputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CDCU_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cdcu-terraform-apply

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: environments/${{ needs.detect-environment.outputs.environment }}

      - name: Terraform Plan (pre-apply verification)
        run: |
          PLAN_ARGS="-no-color -out=tfplan"
          if [ -f terraform.tfvars ]; then
            PLAN_ARGS="-var-file=terraform.tfvars ${PLAN_ARGS}"
          fi
          terraform plan \
            ${PLAN_ARGS}
        working-directory: environments/${{ needs.detect-environment.outputs.environment }}
        env:
          TF_VAR_terraform_role_arn: ${{ secrets.CDCU_TERRAFORM_ROLE_ARN }}
          TF_VAR_vpc_id: ${{ vars.CDCU_VPC_ID }}
          TF_VAR_subnet_id: ${{ vars.CDCU_SUBNET_ID }}
          TF_VAR_github_org: ${{ github.repository_owner }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}
          TF_VAR_git_repository_url: ${{ github.server_url }}/${{ github.repository }}.git
          TF_VAR_sns_topic_arn: ${{ vars.CDCU_SNS_TOPIC_ARN }}
          TF_VAR_quicksight_admin_principal_arn: ${{ vars.CDCU_QUICKSIGHT_ADMIN_PRINCIPAL_ARN }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: environments/${{ needs.detect-environment.outputs.environment }}

      - name: Capture Outputs
        run: terraform output -json > terraform_outputs.json
        working-directory: environments/${{ needs.detect-environment.outputs.environment }}

      - name: Upload Outputs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ needs.detect-environment.outputs.environment }}
          path: environments/${{ needs.detect-environment.outputs.environment }}/terraform_outputs.json
          retention-days: 30
